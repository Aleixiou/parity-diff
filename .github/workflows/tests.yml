name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml so nothing publishes without a green suite.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks first: they are seconds against minutes, so a type error or a
  # lint regression fails before five test matrices spin up databases.
  static:
    name: types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: install
        # ruff is pinned: an unpinned formatter would turn any upstream style
        # change into a red build on an unrelated PR. Bump it deliberately, in
        # a commit that reformats the tree with the new version.
        run: pip install -e ".[all]" mypy ruff==0.16.6

      - name: ruff
        run: ruff check src tests demo

      - name: ruff format
        # `ruff check` never enforced layout, so the formatter drifted until 20
        # of 27 files would have been reformatted - enough that a contributor
        # running it would bury their own change in the diff.
        run: ruff format --check src tests demo

      - name: mypy --strict
        # CLAUDE.md section 6 promises type hints everywhere. Strict is what
        # makes that a fact rather than an aspiration.
        run: mypy src/parity --strict --ignore-missing-imports

  # The full suite, both engines. PostgreSQL comes from a service container.
  cross-engine:
    name: python ${{ matrix.python }} + postgres ${{ matrix.postgres }} + mysql
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        postgres: ["16"]
        include:
          # One run against a newer major, to catch the engines drifting apart.
          - python: "3.13"
            postgres: "18"

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: parity
          POSTGRES_PASSWORD: parity
          POSTGRES_DB: parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: parity
          MYSQL_PASSWORD: parity
          MYSQL_DATABASE: parity_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uparity -pparity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PARITY_TEST_PG: postgres://parity:parity@127.0.0.1:5432/parity
      PARITY_TEST_MYSQL: mysql://parity:parity@127.0.0.1:3306/parity_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: pip install -e ".[all,test]" pytest pytest-cov

      - name: run tests
        # The coverage floor is a ratchet, not a target. It sits below the
        # current figure so it catches a real regression without turning every
        # defensive branch into a mock-shaped test. Only this job can reach it:
        # the DuckDB-only job has no PostgreSQL and legitimately covers less.
        run: pytest -v --cov=parity --cov-report=term-missing --cov-fail-under=95

      - name: the cross-engine tests must not have silently skipped
        # A green run that skipped every PostgreSQL or MySQL test would prove
        # nothing, and that is exactly how a broken service container looks.
        run: pytest tests/test_integration.py tests/test_mysql.py -q --no-header
          -p no:cacheprovider | tee /tmp/out.txt
          && ! grep -qi "skipped" /tmp/out.txt

      - name: end-to-end proof at 200k rows
        run: |
          python demo/generate.py --rows 200000
          python demo/benchmark.py --expect-clean
          python demo/generate.py --rows 200000 --plant
          python demo/benchmark.py --expect-planted

  # A user who installs only the DuckDB extra must still get a working tool -
  # and must never be forced to have a PostgreSQL driver on the machine.
  duckdb-only:
    name: duckdb extra alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -e ".[duckdb,test]" pytest

      - name: psycopg must not be installed
        run: |
          if pip show psycopg > /dev/null 2>&1; then
            echo "the duckdb extra pulled in a PostgreSQL driver"; exit 1
          fi

      - name: --help works with no postgres driver
        run: parity --help && parity --version

      - run: pytest -v

  windows:
    name: windows + duckdb
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[all,test]" pytest
      - run: pytest -v
