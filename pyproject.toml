[project]
# The distribution name is `parity-diff` because `parity` is squatted on
# PyPI by an empty project. The import name, the CLI command and the repo are
# all still `parity`: `pip install parity-diff` gives you `parity ...`.
name = "parity-diff"
version = "0.2.2"
description = "Prove two tables in two different database engines hold the same data - without moving the data out of either engine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Alessio Sorio" }]
keywords = [
    "data-diff", "migration", "postgres", "duckdb", "data-quality",
    "cutover", "warehouse", "parity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
# The core is standard library only. Drivers are extras and are imported
# lazily, so a DuckDB-only user is never made to install a PostgreSQL driver.
dependencies = []

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["mysql-connector-python>=8.0"]
snowflake = ["snowflake-connector-python>=3.0"]
# Draft, not yet in `all`: the BigQuery dialect is unverified against a live
# instance, so it stays opt-in until a live encoding run passes (§8).
bigquery = ["google-cloud-bigquery>=3.0"]
all = [
    "duckdb>=1.0", "psycopg[binary]>=3.1",
    "mysql-connector-python>=8.0", "snowflake-connector-python>=3.0",
]
# Test-only dependencies, kept out of every runtime extra. Hypothesis drives
# the generative suite (tests/test_properties.py); the core stays stdlib-only.
test = ["hypothesis>=6.0"]

[project.urls]
Homepage = "https://github.com/Aleixiou/parity-diff"
Repository = "https://github.com/Aleixiou/parity-diff"
Issues = "https://github.com/Aleixiou/parity-diff/issues"

[project.scripts]
parity = "parity.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "postgres: requires a reachable PostgreSQL server",
    "mysql: requires a reachable MySQL server",
    "duckdb: requires the duckdb driver",
    "snowflake: requires a reachable Snowflake account (PARITY_TEST_SNOWFLAKE)",
    "bigquery: requires a reachable BigQuery project (PARITY_TEST_BIGQUERY)",
]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
# A curated set, not everything. Correctness and portability rules earn their
# keep here; stylistic ones that would churn the diff without making the tool
# more trustworthy are left off.
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # import sorting
    "UP",          # pyupgrade - keeps us on modern typing
    "B",           # bugbear
    "C4",          # comprehensions
    "PIE",
    "RUF",
    "ISC",         # implicit string concatenation: the missing-comma bug class
    "BLE",         # blind excepts must be justified in place
    "S",           # bandit - this tool builds SQL, so injection rules matter
]
ignore = [
    "E501",        # line length is handled by the formatter, not enforced here
    "S101",        # asserts are how the demo scripts state their proofs
    "RUF059",      # unused unpacked values read better than `_` in these tests
]

[tool.ruff.lint.per-file-ignores]
# Tests and demos deliberately build SQL from literals and use asserts.
# S311/S324: test data uses `random` and MD5 as tools, not as security
# primitives. S108: a /tmp path inside a parametrised string, not a real file.
"tests/*" = ["S105", "S106", "S108", "S311", "S324", "S608", "BLE001"]
"demo/*"  = ["S608", "S311"]
# Emitting dialect SQL by hand *is* the product (CLAUDE.md section 6) - there is
# no ORM to hide behind. Safety comes from `quote()` and `sql_literal()`, which
# have their own injection tests in tests/test_encoding.py.
"src/parity/dialects/base.py" = ["S608"]
"src/parity/dialects/postgres_dialect.py" = ["S608"]
"src/parity/dialects/mysql_dialect.py" = ["S608"]
"src/parity/dialects/snowflake_dialect.py" = ["S608"]
"src/parity/dialects/bigquery_dialect.py" = ["S608"]
# proof.py is kept close to the original author's script so it stays readable
# next to the findings it produced; its terse one-line style is deliberate.
"demo/proof.py" = ["E401", "E402", "E701", "E702", "B007", "S311", "S608"]
